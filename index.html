<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الشخصي</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',system-ui,sans-serif}
    body{background:#F5F1EB;color:#2B2117;line-height:1.7}
    .hero{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
    .card{background:#fff;border-radius:24px;padding:32px;max-width:600px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #EDE6DA}
    h1{font-size:32px;font-weight:900;margin-bottom:12px}
    p{color:#6B5A4A}
    .btn{display:inline-block;margin-top:20px;background:#2B2117;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="hero">
    <div class="card">
      <h1>أهلاً بيكي في موقعي ✨</h1>
      <p>ده موقعي الجديد اللي عملته، ولسه هطوره أكتر قريب!</p>
      <a class="btn" href="#">تواصلي معايا</a>
    </div>
  </div>
</body>
</html>
